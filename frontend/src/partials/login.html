<div class="login center-height">
  <div class="login-inner">
    <h1>Sign in</h1>
    <form method="POST" hx-boost="true" action="/auth/login">
      <input type="text" name="username" placeholder="Username" aria-label="Username" autoComplete="username"
        required />
      <input type="password" name="password" placeholder="Password" aria-label="Password"
        autoComplete="current-password" required />
      <input type="submit" value="Login" />
    </form>
    <a href="/src/signup.html" hx-boost="true">Looking to sign up?</a>
  </div>
</div>
